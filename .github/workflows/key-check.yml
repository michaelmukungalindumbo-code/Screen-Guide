name: Key check
on: {push: {branches: [diag-key]}}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOKEN: "${{ github.token }}", U: "https://screen-guide-server.onrender.com"}
        run: |
          curl -s --max-time 90 "$U/version" > v.json; echo "Server version: $(cat v.json)"
          echo "With the fixer's token: HTTP $(curl -s -o r.json -w '%{http_code}' --max-time 60 -H "Authorization: Bearer $GH_TOKEN" "$U/watch/shots/0123456789abcdef") $(cat r.json)"
          echo "With no token: HTTP $(curl -s -o r.json -w '%{http_code}' --max-time 60 "$U/watch/shots/0123456789abcdef") $(cat r.json)"
          echo "With a made-up token: HTTP $(curl -s -o r.json -w '%{http_code}' --max-time 60 -H "Authorization: Bearer ghs_madeup123" "$U/watch/shots/0123456789abcdef") $(cat r.json)"
