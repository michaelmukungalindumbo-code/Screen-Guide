name: Key check
on: {push: {branches: [diag-key]}}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env: {T: "${{ secrets.SERVER_TOKEN }}"}
        run: |
          T=$(printf '%s' "$T" | tr -d '[:space:]')
          R=michaelmukungalindumbo-code/Screen-Guide-Server
          api() { curl -s -o r.json -w '%{http_code}' -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "$@"; }
          echo "Read server repo: HTTP $(api https://api.github.com/repos/$R)"
          sha=$(curl -s -H "Authorization: Bearer $T" https://api.github.com/repos/$R/git/ref/heads/main | jq -r .object.sha)
          echo "Create a test branch: HTTP $(api -X POST https://api.github.com/repos/$R/git/refs -d "{\"ref\":\"refs/heads/token-check\",\"sha\":\"$sha\"}")"
          echo "Delete the test branch: HTTP $(api -X DELETE https://api.github.com/repos/$R/git/refs/heads/token-check)"
          echo "List pull requests: HTTP $(api "https://api.github.com/repos/$R/pulls?per_page=1")"
