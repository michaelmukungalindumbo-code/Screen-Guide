name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - run: |
          Z=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -1)
          echo "Using $Z"
          unzip -q "$Z" -d src
      # The word rules (which task, which app) are tested with real questions first: a wrong match fails the build.
      # Then Android's bug finder (lint): something that would crash some phones fails the build too.
      # A "(tests first)" commit is the new tests sent before their fix, to prove they catch the problem: it is meant to
      # fail. It no longer marks the run as failed (GitHub emailed the owner "Run failed" each time); the log still shows
      # which tests failed.
      - run: cd src && gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
        continue-on-error: ${{ contains(github.event.head_commit.message, '(tests first)') }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: test-and-lint-reports, path: "src/app/build/reports/"}
      - uses: actions/upload-artifact@v4
        with: {name: ScreenGuide-apk, path: src/app/build/outputs/apk/debug/app-debug.apk}
