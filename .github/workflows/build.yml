name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.9"}
      - run: |
          Z=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | head -1)
          echo "Using $Z"
          unzip -q "$Z" -d src
      - run: cd src && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: ScreenGuide-apk, path: src/app/build/outputs/apk/debug/app-debug.apk}
