name: AI fixer
# An issue labelled "ai-fix" starts it. Your server opens these by itself: for app crashes, and (watcher, tester phones)
# for guide problems such as Help repeating itself. You can open one too, with a screen recording attached. The AI then:
#   finds the cause in the app or in the server, proves it with a failing test, makes the smallest fix, runs the tests,
#   and explains it on the issue in plain English.
# App fixes go on a branch here (tap "Create pull request" on its comment). Server fixes arrive as a pull request on
# Screen-Guide-Server (the link is posted on the issue). Nothing reaches phones or the live server until you merge.
# To talk to it afterwards (answer its question, ask for a change), write @claude in a comment on the issue.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30          # a hard stop, so a stuck run cannot use up AI money
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      # The server, next to the app, so the AI can find and fix causes there too (read-only here; see the last step)
      - uses: actions/checkout@v6
        with: {repository: michaelmukungalindumbo-code/Screen-Guide-Server, path: server, fetch-depth: 1, persist-credentials: false}
      # The same tools the APK build uses, so the AI can run the tests and the bug finder before it says "fixed"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      # A screen recording or picture attached to the issue: one picture per second for the AI to look at
      - name: Pictures from attached recordings
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p media
          python3 - > media/urls.txt <<'PY'
          import json, os, re
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          text = ((ev.get("issue") or {}).get("body") or "") + "\n" + ((ev.get("comment") or {}).get("body") or "")
          seen = []
          for u in re.findall(r"https://github\.com/user-attachments/(?:assets|files)/[\w./-]+", text):
              if u not in seen: seen.append(u)
          print("\n".join(seen[:3]))
          PY
          n=0
          while read -r u; do
            [ -z "$u" ] && continue; n=$((n+1))
            curl -sSL --max-filesize 100000000 -o "media/in$n" "$u" || continue
            case "$(file -b --mime-type "media/in$n")" in
              video/*) command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
                       d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "media/in$n" | cut -d. -f1); d=${d:-30}
                       fps=$(python3 -c "print(min(1, 40/max(1,$d)))")
                       mkdir -p "media/video$n" && ffmpeg -v error -i "media/in$n" -vf "fps=$fps,scale=480:-1" -frames:v 40 "media/video$n/frame%03d.png" ;;
              image/*) cp "media/in$n" "media/picture$n.png" ;;
            esac
            rm -f "media/in$n"
          done < media/urls.txt
          ls -R media | head -50
      # A key copied on a phone often brings hidden spaces or line breaks with it. Remove them; the key is never printed.
      - id: key
        env: {KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: |
          k=$(printf '%s' "$KEY" | tr -d '[:space:]')
          echo "::add-mask::$k"
          echo "value=$k" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.key.outputs.value }}
          # The workflow's own short-lived token, so no extra GitHub app has to be installed.
          # (Its pushes do not start the APK build; the build runs when you merge the pull request.)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: "ai-fix"
          branch_prefix: "ai-fix/"
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 50
            --allowedTools "Bash(unzip:*),Bash(zip:*),Bash(gradle:*),Bash(cd:*),Bash(ls:*),Bash(cp:*),Bash(mkdir:*),Bash(rm:*),Bash(cat:*),Bash(grep:*),Bash(git status:*),Bash(git diff:*),Bash(bash tests/run.sh),Bash(python3:*),Bash(ffmpeg:*)"
            --append-system-prompt "The server's code is in server/ (a separate repository): read server/CLAUDE.md before working there. Find where the cause really is: the app (follow CLAUDE.md) or the server (follow server/CLAUDE.md). Never commit anything under server/ or media/ yourself; a later step sends server changes as a pull request. If media/ has video*/frame*.png or picture*.png, the owner attached a screen recording or picture: look at the frames in order (one per second) with the Read tool to see what went wrong before you look at code."
      # Server changes become a pull request on Screen-Guide-Server, and the link goes on the issue
      - name: Send a server fix as a pull request
        if: always()
        env:
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          cd server
          rm -rf __pycache__ tests/__pycache__   # left by running the tests: never part of a fix
          if [ -z "$(git status --porcelain -- . ':!*.pyc' ':!**/__pycache__/**')" ]; then echo "No server changes."; exit 0; fi
          say() { gh issue comment "$ISSUE" --repo "$REPO" --body "$1"; }
          if [ -z "$SERVER_TOKEN" ]; then
            say "The fix is in the server, but I can't send it yet: the \`SERVER_TOKEN\` secret is missing in this repository."; exit 0
          fi
          title=$(head -1 ../media/server-fix.md 2>/dev/null | sed 's/^#* *//' | cut -c1-120)
          [ -n "$title" ] || title="AI fixer: server fix for Screen-Guide issue #$ISSUE"
          branch="ai-fix/screen-guide-$ISSUE-$(date +%Y%m%d-%H%M)"
          git checkout -q -b "$branch"
          git add -A -- . ':!*.pyc' ':!**/__pycache__/**'
          git -c user.name="AI fixer" -c user.email="ai-fixer@users.noreply.github.com" commit -q -m "$title" -m "From $REPO#$ISSUE"
          git push -q "https://x-access-token:${SERVER_TOKEN}@github.com/michaelmukungalindumbo-code/Screen-Guide-Server.git" "$branch"
          { tail -n +2 ../media/server-fix.md 2>/dev/null; printf '\n\nFrom %s#%s. Render puts this live after you merge and the tests pass.\n' "$REPO" "$ISSUE"; } > body.md
          url=$(GH_TOKEN="$SERVER_TOKEN" gh api repos/michaelmukungalindumbo-code/Screen-Guide-Server/pulls \
                -f title="$title" -f head="$branch" -f base=main -F body=@body.md -q .html_url)
          rm -f body.md
          say "**The fix is in the server.** Open $url and tap **Merge pull request**. Render puts it live after the tests pass."
